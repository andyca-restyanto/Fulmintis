# filepath: /.github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    # Memastikan Dockerfile & compose valid sebelum sampai ke server.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci/; s/^JWT_SECRET=$/JWT_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/; s/^MAIL_USERNAME=$/MAIL_USERNAME=ci/; s/^MAIL_PASSWORD=$/MAIL_PASSWORD=ci/' .env
      - run: docker compose config -q
      - run: docker compose build
