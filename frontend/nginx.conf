# Domain: fulmintis.web.id

# ---------- HTTP: hanya redirect ke HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name fulmintis.web.id www.fulmintis.web.id;
    server_tokens off;

    return 301 https://fulmintis.web.id$request_uri;
}

# ---------- HTTPS: www -> non-www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fulmintis.web.id;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/fulmintis.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fulmintis.web.id/privkey.pem;

    return 301 https://fulmintis.web.id$request_uri;
}

# ---------- HTTPS: aplikasi utama ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fulmintis.web.id;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;   # samakan dengan spring.servlet.multipart.max-request-size

    # Sertifikat Let's Encrypt (di-mount read-only dari host)
    ssl_certificate     /etc/letsencrypt/live/fulmintis.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fulmintis.web.id/privkey.pem;

    # TLS modern
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS internal Docker: nama "backend" di-resolve saat request, BUKAN saat Nginx start.
    # Jadi Nginx tetap bisa start walaupun backend sedang mati/restart (API sementara 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> Spring Boot
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # TIMPA (bukan append) agar IP klien tidak bisa dipalsukan
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Asset hasil build Vite (nama file ber-hash)
    location /assets/ {
        expires 1y;   # pakai 'expires' (bukan add_header) agar security header di atas tetap terwariskan
        try_files $uri =404;
    }

    # SPA fallback untuk Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
