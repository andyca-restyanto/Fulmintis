server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                       # sembunyikan versi Nginx
    client_max_body_size 20m;                # batas upload, sesuaikan kebutuhan

    # Security headers dasar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Semua request /api/ diteruskan ke container backend (Spring Boot)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache lama untuk asset hasil build Vite (nama file sudah ber-hash)
    location /assets/ {
        expires 1y;                          # pakai 'expires' (bukan add_header) agar security header di atas tetap terwariskan
        try_files $uri =404;
    }

    # SPA fallback supaya Vue Router (history mode) tidak 404 saat refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
