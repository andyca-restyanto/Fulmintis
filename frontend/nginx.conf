# filepath: /frontend/nginx.conf
# Satu origin: SPA di "/", API di "/api" (diteruskan ke container "backend").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Batas unggah evidence (samakan dengan batas di backend bila diubah).
    client_max_body_size 25m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # MENIMPA (bukan menambah) X-Forwarded-For agar klien tidak bisa memalsukan IP untuk rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 200s; # generate AI bisa lama (timeout VIP 180 dtk)
    }

    # Aset ber-hash dari Vite: cache panjang.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA (vue-router history mode). index.html tidak di-cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
