services:
  backend:
    build: ./backend
    container_name: fulmintis-backend
    restart: unless-stopped
    env_file: .env                            # kredensial DB & SMTP dibaca dari .env di server
    extra_hosts:
      - "host.docker.internal:host-gateway"   # akses PostgreSQL yang terinstall di host VPS
    expose:
      - "8080"                                # internal saja, TIDAK dibuka ke internet
    volumes:
      - /opt/fulmintis-data/uploads:/var/data/frontline-uploads   # upload evidence persisten (tidak hilang saat redeploy)
    networks: [fulmintis]

  frontend:
    build: ./frontend
    container_name: fulmintis-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # sertifikat HTTPS dari Certbot di host (read-only)
    networks: [fulmintis]

networks:
  fulmintis:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16               # HARUS sama dengan pg_hba.conf & UFW di VPS
