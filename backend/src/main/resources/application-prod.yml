# Profil produksi — aktif lewat SPRING_PROFILES_ACTIVE=prod di .env server.
# File ini AMAN di-commit: hanya berisi placeholder, nilai asli ada di .env di VPS.
#
# PENTING: prefix "spring.datasource.master-data" dan "spring.datasource.frontline"
# harus SAMA dengan prefix di @ConfigurationProperties pada kelas config datasource kamu.

spring:
  datasource:
    master-data:
      jdbc-url: ${MASTER_DATA_DB_URL}
      username: ${MASTER_DATA_DB_USER}
      password: ${MASTER_DATA_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    frontline:
      jdbc-url: ${FRONTLINE_DB_URL}
      username: ${FRONTLINE_DB_USER}
      password: ${FRONTLINE_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  # ---- SMTP SumoPod (smtp.sumopod.com:465, SSL/TLS langsung) ----
  mail:
    host: ${MAIL_HOST:smtp.sumopod.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true                 # port 465 = implicit TLS (bukan STARTTLS)
            checkserveridentity: true    # verifikasi sertifikat cocok dengan hostname
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  mail:
    from: ${MAIL_FROM}
  base-url: ${APP_BASE_URL}

server:
  port: 8080
  forward-headers-strategy: framework   # baca X-Forwarded-* dari Nginx (penting untuk HTTPS)
