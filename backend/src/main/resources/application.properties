# backend/src/main/resources/application.properties

# ---- Application ----
spring.application.name=frontline

# Profile default = local (baca application-local.properties untuk kredensial DB).
# Bisa di-override saat deploy, misal: -Dspring.profiles.active=prod
spring.profiles.active=local

# ---- Datasource UTAMA (PostgreSQL, database: frontline) ----
# username & password TIDAK ditaruh di sini, lihat application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/frontline
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Datasource KEDUA (PostgreSQL, database TERPISAH: master_data) ----
# Database "master_data" HARUS sudah dibuat manual dulu di PostgreSQL
# (CREATE DATABASE master_data;) SEBELUM aplikasi di-start -- JDBC tidak bisa
# auto-create database, cuma bisa auto-create TABEL di database yang sudah ada.
# username & password TIDAK ditaruh di sini, lihat application-local.properties
app.datasource.masterdata.url=jdbc:postgresql://localhost:5432/master_data
app.datasource.masterdata.driver-class-name=org.postgresql.Driver

# ---- Connection Pool (HikariCP, default di Spring Boot) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: Flyway dimatikan, jadi Hibernate yang create/update skema otomatis
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway (dimatikan) ----
spring.flyway.enabled=false

# ---- CORS ----
# Daftar origin frontend yang diizinkan, pisahkan dengan koma kalau lebih dari satu.
# Vite dev server default: http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Mail (SMTP) ----
# username & password TIDAK ditaruh di sini, lihat application-local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@frontline.com

# ---- App URL (dipakai utk generate link verifikasi & redirect setelah verifikasi) ----
app.backend.base-url=http://localhost:8080
app.frontend.base-url=http://localhost:5173

# ---- Verification token ----
app.security.verification-token-expiry-minutes=1440

# ---- Reset password token ----
# Lebih pendek dari verification token (24 jam) krn reset password lebih
# sensitif -- 60 menit cukup untuk user cek email & klik link.
app.security.reset-password-token-expiry-minutes=60

# ---- JWT (login token) ----
# app.security.jwt-secret TIDAK ditaruh di sini, lihat application-local.properties
app.security.jwt-expiration-minutes=60

# ---- Server ----
server.port=8080

# ---- File storage (evidence upload test run) ----
app.storage.base-dir=uploads

# ---- Multipart (upload evidence bisa berupa video, default Spring cuma 1MB) ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
