# filepath: /backend/src/main/resources/application-prod.properties
# =============================================================================
# Profil PRODUKSI. Aktifkan lewat environment variable:
#     SPRING_PROFILES_ACTIVE=prod
# (env var / -Dspring.profiles.active mengalahkan spring.profiles.active=local
# di application.properties).
#
# Semua rahasia & alamat WAJIB datang dari environment variable -- sengaja
# TANPA nilai default, sehingga aplikasi gagal start (bukan diam-diam memakai
# nilai lokal) kalau ada yang lupa diisi. JANGAN menaruh kredensial di file ini.
# =============================================================================

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.datasource.masterdata.url=${MASTER_DB_URL}
app.datasource.masterdata.username=${MASTER_DB_USERNAME}
app.datasource.masterdata.password=${MASTER_DB_PASSWORD}

# ---- Skema: Flyway yang membuat/mengubah, Hibernate hanya MEMERIKSA ----
# validate = start gagal kalau entity tidak cocok dengan skema (lebih baik
# gagal saat deploy daripada error SQL saat user memakai fitur).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB baru (kosong)   : semua V1..V15 dijalankan berurutan.
# DB lama buatan Hibernate (tanpa riwayat Flyway): ditandai sudah di V14 lalu
# hanya V15 dan V16 yang dijalankan. Ubah angka ini kalau skema lama Anda berbeda.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=14
# Flyway hanya memigrasi DB "frontline". DB "master_data" (user_type,
# project_team) TIDAK disentuh Flyway -- jalankan sekali secara manual:
# src/main/resources/db/master-data-migration/V1 dan V2 (seeder mengisi datanya).

# ---- Log SQL dimatikan (di lokal true = membocorkan data ke log) ----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Keamanan ----
# Minimal 32 karakter acak (HS256 butuh >= 256 bit). Buat baru, JANGAN pakai
# secret dari lingkungan lokal/dev.
app.security.jwt-secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Di belakang reverse proxy/load balancer yang MENIMPA X-Forwarded-For,
# ubah ke true agar rate limit membaca IP klien asli (bukan IP proxy).
app.rate-limit.trust-forward-headers=${RATE_LIMIT_TRUST_FORWARD_HEADERS:false}

# ---- URL publik (dipakai di link email verifikasi & reset password) ----
app.backend.base-url=${BACKEND_BASE_URL}
app.frontend.base-url=${FRONTEND_BASE_URL}

# ---- Email (SMTP) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Boleh "Fulmintis <no-reply@domainanda.com>" (nama pengirim tampil di inbox).
# Kalau hanya alamat ("no-reply@domainanda.com"), backend otomatis memakai
# app.brand.name sebagai nama pengirim.
app.mail.from=${MAIL_FROM}
# Nama produk di subjek & isi email. Default di kode sudah "Fulmintis"; baris
# ini hanya untuk override tanpa deploy ulang kode.
app.brand.name=${BRAND_NAME:Fulmintis}

# ---- Storage evidence: arahkan ke volume persisten di server ----
app.storage.base-dir=${STORAGE_BASE_DIR:/var/data/frontline-uploads}

# ---- AI (generate kode automation) ----
# KOSONGKAN app.ai.provider = fitur Generate nonaktif (aplikasi tetap start normal; setup struktur tetap bisa dipakai).
# JANGAN isi "fake" di sini: aplikasi sengaja GAGAL START bila provider=fake di profil prod (user produksi tidak boleh
# menerima kode palsu). Provider sungguhan butuh satu adapter AiClient + semua nilai di bawah terisi (kalau tidak, gagal start).
# API key HANYA dari environment variable; tidak pernah ke frontend dan tidak pernah ditulis ke log.
app.ai.provider=${AI_PROVIDER:}
app.ai.base-url=${AI_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
# Batas generate seluruh sistem per hari (pengaman biaya; 0 = tanpa batas) dan jeda setelah provider melaporkan kuota habis.
app.ai.global-daily-limit=${AI_GLOBAL_DAILY_LIMIT:0}
app.ai.quota-circuit-minutes=${AI_QUOTA_CIRCUIT_MINUTES:10}
# Tier FREE
app.ai.free.model=${AI_FREE_MODEL:}
app.ai.free.max-test-cases=${AI_FREE_MAX_TEST_CASES:5}
app.ai.free.daily-limit=${AI_FREE_DAILY_LIMIT:3}
app.ai.free.max-output-tokens=${AI_FREE_MAX_OUTPUT_TOKENS:4096}
app.ai.free.timeout-seconds=${AI_FREE_TIMEOUT_SECONDS:120}
# Tier VIP (VIP_MONTHLY dan VIP_YEARLY memakai konfigurasi yang sama)
app.ai.vip.model=${AI_VIP_MODEL:}
app.ai.vip.max-test-cases=${AI_VIP_MAX_TEST_CASES:20}
app.ai.vip.daily-limit=${AI_VIP_DAILY_LIMIT:30}
app.ai.vip.max-output-tokens=${AI_VIP_MAX_OUTPUT_TOKENS:8192}
app.ai.vip.timeout-seconds=${AI_VIP_TIMEOUT_SECONDS:180}
# Angka bawaan di atas hanyalah PLACEHOLDER utk dev/uji -- tentukan angka produksi (model, token, harga) saat provider tersedia.

# ---- AI: Gemini (Google) + generate test case ----
# Provider sungguhan: app.ai.provider=gemini. Di profil prod aplikasi GAGAL START kalau provider=gemini tetapi
# app.ai.billing-tier bukan "paid": akun free tier Google dapat memakai prompt user utk memperbaiki produknya, jadi produksi WAJIB memakai
# project Google Cloud TERPISAH dengan billing aktif + key sendiri (jangan memakai key AI Studio free tier dari development).
# Key HANYA dari environment variable; format key tidak divalidasi (key baru berawalan "AQ." sah).
# Alamat bawaan Gemini dipakai kalau AI_BASE_URL kosong.
# Bawaan SENGAJA "free": produksi dengan provider gemini baru bisa start setelah AI_BILLING_TIER=paid DIISI EKSPLISIT (pilihan sadar).
app.ai.billing-tier=${AI_BILLING_TIER:free}
# Generate test case: batas per tier (kuota TERPISAH dari Automation). Bawaan kode: FREE 3 generate/hari & 3 draft; VIP 15 & 15.
app.ai.free.testcase-daily-limit=${AI_FREE_TESTCASE_DAILY_LIMIT:3}
app.ai.free.testcase-max-drafts=${AI_FREE_TESTCASE_MAX_DRAFTS:3}
app.ai.free.testcase-max-output-tokens=${AI_FREE_TESTCASE_MAX_OUTPUT_TOKENS:4096}
app.ai.free.testcase-timeout-seconds=${AI_FREE_TESTCASE_TIMEOUT_SECONDS:90}
app.ai.vip.testcase-daily-limit=${AI_VIP_TESTCASE_DAILY_LIMIT:15}
app.ai.vip.testcase-max-drafts=${AI_VIP_TESTCASE_MAX_DRAFTS:15}
app.ai.vip.testcase-max-output-tokens=${AI_VIP_TESTCASE_MAX_OUTPUT_TOKENS:8192}
app.ai.vip.testcase-timeout-seconds=${AI_VIP_TESTCASE_TIMEOUT_SECONDS:120}
app.ai.testcase.max-requirement-chars=${AI_TESTCASE_MAX_REQUIREMENT_CHARS:6000}
app.ai.testcase.draft-retention-days=${AI_TESTCASE_DRAFT_RETENTION_DAYS:7}
# Dua parameter Gemini di bawah BELUM terverifikasi terhadap API sungguhan -> bawaan MATI (kosong). Isi hanya setelah diuji:
#   AI_GEMINI_RESPONSE_SCHEMA = off | response-schema | response-json-schema
#   AI_GEMINI_THINKING_BUDGET = bilangan bulat (token thinking ditagih sbg output; 0 mematikannya di model yang mendukung)
app.ai.gemini.response-schema=${AI_GEMINI_RESPONSE_SCHEMA:off}
app.ai.gemini.thinking-budget=${AI_GEMINI_THINKING_BUDGET:}
app.ai.gemini.temperature=${AI_GEMINI_TEMPERATURE:}
# Rate limit endpoint generate test case (per IP per menit)
app.rate-limit.testcase-ai-per-minute=${RATE_LIMIT_TESTCASE_AI_PER_MINUTE:6}

